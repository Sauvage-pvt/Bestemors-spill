<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E4038">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spillebordet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Spillebordet</title>
<style>
:root{
  --felt:#1E4038; --felt-d:#16302A; --felt-l:#2A5449;
  --paper:#F6EFE2; --paper-d:#E4D9C4;
  --ink:#22302B; --ink-soft:#5E6F68;
  --amber:#E0A13A; --amber-d:#B87F24;
  --rose:#C4614F; --sky:#7FB3AE;
  --r:14px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--felt);
  background-image:radial-gradient(circle at 50% 0%, var(--felt-l) 0%, var(--felt) 55%, var(--felt-d) 100%);
  min-height:100%;
  color:var(--paper);
  font:400 17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  touch-action:manipulation;-webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.wrap{max-width:520px;margin:0 auto;padding:0 12px calc(24px + var(--safe-b))}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:30;
  padding-top:calc(6px + var(--safe-t));
  display:flex;align-items:center;gap:10px;min-height:56px;
  background:linear-gradient(var(--felt-d) 70%, rgba(22,48,42,0));
  margin:0 -12px;padding-left:12px;padding-right:12px;padding-bottom:8px;
}
.back{
  display:flex;align-items:center;gap:6px;
  background:rgba(246,239,226,.1);border:1px solid rgba(246,239,226,.22);
  border-radius:999px;padding:10px 16px 10px 12px;font-weight:600;font-size:16px;
  min-height:44px;
}
.back:active{background:rgba(246,239,226,.2)}
.bar h2{
  font-family:Georgia,"Times New Roman",serif;font-weight:400;
  font-size:20px;margin:0;letter-spacing:.01em;flex:1;text-align:right;color:var(--paper)
}

/* ---------- menu ---------- */
.hero{padding:26px 4px 18px;text-align:center}
.hero .mark{
  font-family:Georgia,serif;font-size:34px;line-height:1.1;letter-spacing:-.01em;
  margin:0 0 6px;color:var(--paper)
}
.hero .mark em{font-style:italic;color:var(--amber)}
.hero p{margin:0;color:rgba(246,239,226,.62);font-size:15px}
.tiles{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.tile{
  display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  background:var(--paper);color:var(--ink);
  border-radius:var(--r);padding:16px 18px;min-height:88px;
  box-shadow:0 3px 0 var(--paper-d), 0 10px 22px rgba(0,0,0,.28);
  transition:transform .12s ease, box-shadow .12s ease;
}
.tile:active{transform:translateY(3px);box-shadow:0 0 0 var(--paper-d),0 6px 14px rgba(0,0,0,.3)}
.tile .ic{width:52px;height:52px;flex:0 0 52px}
.tile b{display:block;font-family:Georgia,serif;font-weight:400;font-size:22px;line-height:1.2}
.tile span{display:block;color:var(--ink-soft);font-size:14px;margin-top:3px}
.tile .pab{
  display:inline-block;margin-top:5px;padding:3px 10px;border-radius:999px;
  background:var(--felt);color:var(--paper);font-size:12px;font-weight:650;
}
.fortsett{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--amber);color:#2A1D05;border-radius:var(--r);
  padding:15px 18px;min-height:74px;margin-bottom:14px;
  box-shadow:0 3px 0 var(--amber-d), 0 10px 22px rgba(0,0,0,.28);
}
.fortsett:active{transform:translateY(3px);box-shadow:0 0 0 var(--amber-d),0 6px 14px rgba(0,0,0,.3)}
.fortsett .pil{font-size:26px;line-height:1}
.fortsett b{display:block;font-family:Georgia,serif;font-weight:400;font-size:21px;line-height:1.2}
.fortsett span{display:block;font-size:14px;margin-top:3px;opacity:.75}
.foot{margin:22px 4px 0;text-align:center;color:rgba(246,239,226,.45);font-size:13px;line-height:1.6}
.tilbake{
  display:block;margin:14px auto 0;padding:12px 20px;min-height:46px;
  text-align:center;text-decoration:none;
  color:rgba(246,239,226,.72);font-size:15px;font-weight:600;
  border-radius:999px;border:1px solid rgba(246,239,226,.18);
  width:fit-content;
}
#bil .bane{position:relative;width:100%;max-width:min(340px,calc(100% - 20px));aspect-ratio:1;margin:0 auto;
  background:rgba(0,0,0,.18);border-radius:14px;padding:0;
  display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);
  gap:0;overflow:visible;touch-action:manipulation}
#bil .rute{border:1px solid rgba(246,239,226,.10)}
#bil .bil{position:absolute;border-radius:9px;box-shadow:0 2px 5px rgba(0,0,0,.4);
  background:#7FB3AE;border:2px solid rgba(0,0,0,.25);cursor:pointer;
  transition:left .16s ease,top .16s ease;z-index:2}
#bil .bil.rod{background:#C4614F}
#bil .bil:nth-of-type(3n){background:#E0A13A}
#bil .bil:nth-of-type(4n){background:#8B5BC0}
#bil .bil.rod{background:#C4614F!important}
#bil .bil.valgt{border-color:#F6EFE2;box-shadow:0 0 0 3px rgba(246,239,226,.55),0 2px 6px rgba(0,0,0,.4)}
#bil .tref{position:absolute;z-index:1;cursor:pointer;background:transparent}
#bil .utgang{position:absolute;right:-13px;width:13px;z-index:4;cursor:pointer;
  border-radius:0 7px 7px 0;background:rgba(126,179,174,.5)}
#bil .utgang:active{background:rgba(126,179,174,.85)}
#mol .brett{width:100%;max-width:340px;margin:0 auto;display:block;touch-action:manipulation}
#mol .rute{stroke:rgba(246,239,226,.36);stroke-width:1.5;fill:none}
#mol .hull{fill:rgba(246,239,226,.26)}
#mol .hull.mulig{fill:#7FB3AE}
#mol .br{stroke:#22302B;stroke-width:1.1}
#mol .br.p1{fill:#F6EFE2}
#mol .br.p2{fill:#E0A13A}
#mol .br.valgt{stroke:#C4614F;stroke-width:2.8}
#mol .br.kan{stroke:#C4614F;stroke-width:2.4;stroke-dasharray:3.5 2.5}
#mol .tref{fill:transparent;cursor:pointer}
.tilbake:active{background:rgba(246,239,226,.14)}
.bytt{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin:16px auto 0;padding:14px 22px;min-height:52px;
  text-decoration:none;width:fit-content;max-width:100%;
  color:var(--ink);background:var(--paper);
  font-size:16px;font-weight:700;border-radius:999px;
  box-shadow:0 3px 0 var(--paper-d);
}
.bytt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--paper-d)}
.bytt span{font-size:22px;line-height:1}
.ver{margin-top:14px;text-align:center;color:rgba(246,239,226,.3);font-size:12px}

/* ---------- shared game chrome ---------- */
.ctrls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:2px 0 12px}
.btn{
  background:var(--amber);color:#2A1D05;font-weight:650;font-size:15px;
  border-radius:999px;padding:11px 18px;min-height:44px;
  box-shadow:0 3px 0 var(--amber-d);
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--amber-d)}
.btn.ghost{background:rgba(246,239,226,.12);color:var(--paper);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn[disabled]{opacity:.4}
.status{text-align:center;color:rgba(246,239,226,.72);font-size:15px;margin:0 0 10px;min-height:22px}
.status b{color:var(--amber);font-weight:650}
.seg{display:flex;gap:6px;justify-content:center;margin:0 0 14px;background:rgba(0,0,0,.2);padding:5px;border-radius:999px}
.seg button{flex:1;border-radius:999px;padding:9px 6px;font-size:15px;font-weight:600;color:rgba(246,239,226,.72);min-height:42px}
.seg button.on{background:var(--paper);color:var(--ink)}

/* ---------- melding (toast) ---------- */
.toast{
  position:fixed;left:50%;z-index:55;
  top:calc(var(--safe-t) + 64px);
  padding:13px 24px;border-radius:999px;
  font-weight:650;font-size:17px;text-align:center;
  max-width:88vw;pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  background:var(--amber);color:#2A1D05;
  animation:tin .18s ease-out;
}
.toast.no{background:var(--rose);color:#fff}
.toast.ut{animation:tut .3s ease-in forwards}
@keyframes tin{from{transform:translate(-50%,-14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes tut{to{transform:translate(-50%,-10px);opacity:0}}
.toast{transform:translateX(-50%)}

/* ---------- lydbryter ---------- */
.lyd{
  display:flex;align-items:center;justify-content:center;gap:9px;
  margin:18px auto 0;padding:12px 22px;min-height:48px;
  border-radius:999px;background:rgba(246,239,226,.12);
  border:1px solid rgba(246,239,226,.22);
  color:var(--paper);font-size:16px;font-weight:600;
}
.lyd:active{background:rgba(246,239,226,.22)}
.lyd .pip{width:11px;height:11px;border-radius:50%;background:var(--amber)}
.lyd.av .pip{background:rgba(246,239,226,.3)}

/* ---------- win overlay ---------- */
.over{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(11,26,22,.82);padding:24px}
.over .box{background:var(--paper);color:var(--ink);border-radius:20px;padding:30px 26px;text-align:center;max-width:340px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.over h3{font-family:Georgia,serif;font-weight:400;font-size:27px;margin:0 0 8px}
.over p{margin:0 0 20px;color:var(--ink-soft);font-size:16px}
.over .btn{width:100%;justify-content:center}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.over .box{animation:pop .22s ease-out}

/* ---------- kabal ---------- */
#kab .row,.kortbord .row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
#kab .cols,.kortbord .cols{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px;align-items:start}
#kab .pile,#kab .col,.kortbord .pile,.kortbord .col{position:relative}
#kab .pile,.kortbord .pile{aspect-ratio:5/7}
#kab .slot,.kortbord .slot{position:absolute;top:0;left:0;right:0;aspect-ratio:5/7;border-radius:8px;border:2px dashed rgba(246,239,226,.3);display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(246,239,226,.34)}
#kab .pile .card,.kortbord .pile .card{top:0}
.card{
  position:absolute;left:0;right:0;aspect-ratio:5/7;border-radius:8px;
  background:var(--paper);color:var(--ink);
  box-shadow:0 2px 5px rgba(0,0,0,.5);overflow:hidden;
  display:flex;flex-direction:column;padding:3px 0 0 3px;
}
.card.st{position:relative}
.card.red{color:var(--rose)}
.card .rk{font:750 19px/1 -apple-system,sans-serif;letter-spacing:-.04em}
.card .su{font-size:15px;line-height:1;margin-top:1px}
.card .big{position:absolute;right:2px;bottom:0px;font-size:30px;opacity:.2;line-height:1}
.card.down{background:var(--felt-l);background-image:repeating-linear-gradient(45deg,rgba(224,161,58,.22) 0 4px,transparent 4px 8px);border:1.5px solid rgba(224,161,58,.5)}
.card.sel{outline:3px solid var(--amber);outline-offset:-1px;transform:translateY(-4px)}
.card.hint{outline:2px solid var(--sky)}

/* ---------- memory ---------- */
#mem .grid{display:grid;gap:9px;margin-top:4px}
.mc{perspective:700px;aspect-ratio:1/1.18}
.mc .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mc.up .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center}
.mc .b{background:var(--felt-l);border:2px solid rgba(224,161,58,.45);background-image:repeating-linear-gradient(45deg,rgba(224,161,58,.16) 0 5px,transparent 5px 10px)}
.mc .b s{width:16px;height:16px;border-radius:50%;background:var(--amber);opacity:.75}
.mc .f{background:var(--paper);transform:rotateY(180deg);font-size:34px;box-shadow:0 2px 0 var(--paper-d)}
.mc.done .f{background:#DFEFE4;opacity:.62}

/* ---------- sudoku ---------- */
#sud .board{display:grid;grid-template-columns:repeat(9,1fr);background:var(--ink);gap:1px;border:3px solid var(--ink);border-radius:8px;overflow:hidden;max-width:400px;margin:0 auto}
#sud .cl{aspect-ratio:1;background:var(--paper);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font:600 20px/1 -apple-system,sans-serif;font-variant-numeric:tabular-nums}
#sud .cl.r3{border-right:2px solid var(--ink)}
#sud .cl.b3{border-bottom:2px solid var(--ink)}
#sud .cl.giv{color:var(--ink);font-weight:750}
#sud .cl.peer{background:#EDE4D2}
#sud .cl.same{background:#F3DFB4}
#sud .cl.sel{background:var(--amber);color:#2A1D05}
#sud .cl.bad{color:var(--rose)}
#sud .pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:400px;margin:14px auto 0}
#sud .pad button{position:relative;background:var(--paper);color:var(--ink);border-radius:12px;min-height:54px;font:650 24px/1 -apple-system,sans-serif;box-shadow:0 3px 0 var(--paper-d);transition:opacity .22s,transform .22s}
#sud .pad button[data-igjen]::after{content:attr(data-igjen);position:absolute;top:4px;right:7px;font:700 11px/1 -apple-system,sans-serif;opacity:.5}
#sud .pad button.oppbrukt{opacity:.26;transform:scale(.93);pointer-events:none;box-shadow:0 1px 0 var(--paper-d)}
#sud .pad button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--paper-d)}
#sud .pad button.er{background:rgba(246,239,226,.14);color:var(--paper);font-size:15px;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.2)}

/* ---------- ordsøk ---------- */
#ord .board{--lt:26px;display:grid;gap:3px;background:rgba(0,0,0,.18);padding:6px;border-radius:10px;max-width:400px;margin:0 auto}
#ord .lt{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);border-radius:6px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-weight:650;line-height:1;font-size:var(--lt)}
#ord .words li{font-size:17px}
#ord .seg2{margin-top:-6px}
#ord .lt.pick{background:var(--sky);color:#0F2A26}
#ord .lt.got{background:var(--amber);color:#2A1D05}
#ord .words{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;max-width:400px;margin:16px auto 0}
#ord .words li{list-style:none;font-size:16px;letter-spacing:.02em;color:var(--paper)}
#ord .words li.got{color:rgba(246,239,226,.38);text-decoration:line-through}

/* ---------- fargesortering ---------- */
#far .tubes{display:flex;flex-wrap:wrap;gap:14px 16px;justify-content:center;padding:10px 0 4px}
.tube{
  width:52px;padding:6px 5px;border-radius:6px 6px 22px 22px;
  background:rgba(246,239,226,.09);border:2px solid rgba(246,239,226,.28);
  display:flex;flex-direction:column-reverse;gap:4px;min-height:186px;justify-content:flex-start;
}
.tube.on{border-color:var(--amber);background:rgba(224,161,58,.16)}
.tube .ball{height:36px;border-radius:50%;box-shadow:inset 0 -5px 8px rgba(0,0,0,.28), inset 0 4px 6px rgba(255,255,255,.4)}
.tube .ball.lift{transform:translateY(-7px)}
@keyframes shk{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
.tube.no{animation:shk .3s}

/* ---------- minesveiper ---------- */
#min .board{display:grid;gap:3px;justify-content:center;margin:0 auto;max-width:420px}
#min .mr{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:6px;background:var(--felt-l);
  border:1.5px solid rgba(246,239,226,.22);
  font:750 17px/1 -apple-system,sans-serif;font-variant-numeric:tabular-nums;
}
#min .mr:active{background:rgba(246,239,226,.2)}
#min .mr.apen{background:var(--paper);border-color:var(--paper-d);box-shadow:none}
#min .mr.flagg{background:rgba(224,161,58,.22);border-color:var(--amber);font-size:19px}
#min .mr.mine{background:var(--rose);font-size:19px}
#min .mr.n1{color:#3D6FD4}#min .mr.n2{color:#2F7D46}#min .mr.n3{color:#C4614F}
#min .mr.n4{color:#7A4BB0}#min .mr.n5{color:#9A6612}#min .mr.n6{color:#2C8791}
#min .mr.n7{color:#22302B}#min .mr.n8{color:#5E6F68}

/* ---------- bærplukk ---------- */
#bar .board{display:grid;gap:5px;max-width:400px;margin:0 auto}
#bar .bt{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  background:var(--paper);border-radius:12px;font-size:clamp(19px,6.6vw,29px);
  box-shadow:0 2px 0 var(--paper-d);
  transition:transform .12s ease;
}
#bar .bt.valgt{outline:3px solid var(--amber);transform:scale(.92)}
#bar .bt.vekk{opacity:.15;transform:scale(.5)}
#bar .bt.nei{animation:shk .3s}
#bar .mal{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin:0 auto 12px;padding:10px 20px;border-radius:999px;
  background:rgba(0,0,0,.2);font-size:17px;width:fit-content;
}
#bar .mal span{font-size:26px}
#bar .mal b{color:var(--amber);font-size:19px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="bar" hidden>
    <button class="back" id="back">‹ Meny</button>
    <h2 id="title"></h2>
  </div>
  <main id="app"></main>
</div>
<script>
/* ============ felles ============ */
var VERSJON='1.10';

/* ---------- lokal lagring: alt ligger på telefonen, ingenting sendes ---------- */
var Lager={
  hent:function(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } },
  sett:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } },
  slett:function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
/* huskede valg: vanskelighetsgrad, kategori, modus */
var Valg={
  hent:function(id){ return Lager.hent('sb-valg-'+id)||{}; },
  sett:function(id,o){ Lager.sett('sb-valg-'+id,o); }
};
/* pågående spill - ett lagret brett per spill */
var SPILL_NAA=null, lagreTimer=null;
function lagreSenere(){
  if(lagreTimer)clearTimeout(lagreTimer);
  lagreTimer=setTimeout(lagreNaa,350);
}
function lagreNaa(){
  if(lagreTimer){clearTimeout(lagreTimer);lagreTimer=null;}
  if(!SPILL_NAA)return;
  var d=null;
  try{ d=SPILL_NAA.dump(); }catch(e){ d=null; }
  if(d===null||d===undefined)Lager.slett('sb-spill-'+SPILL_NAA.id);
  else Lager.sett('sb-spill-'+SPILL_NAA.id,{t:Date.now(),d:d});
}
function slettLagret(){
  if(lagreTimer){clearTimeout(lagreTimer);lagreTimer=null;}
  if(SPILL_NAA)Lager.slett('sb-spill-'+SPILL_NAA.id);
}
function lagretFor(id){ return Lager.hent('sb-spill-'+id); }
/* skriv med en gang appen legges bort */
window.addEventListener('pagehide',lagreNaa);
document.addEventListener('visibilitychange',function(){ if(document.hidden)lagreNaa(); });

function tidTekst(t){
  var dag=86400000, naa=Date.now();
  var d0=new Date(naa); d0.setHours(0,0,0,0);
  if(t>=d0.getTime())return 'påbegynt i dag';
  if(t>=d0.getTime()-dag)return 'påbegynt i går';
  var n=Math.round((d0.getTime()-t)/dag)+1;
  if(n<7)return 'påbegynt for '+n+' dager siden';
  return 'påbegynt tidligere';
}
var app=document.getElementById('app'), bar=document.getElementById('bar'),
    titleEl=document.getElementById('title'), backBtn=document.getElementById('back');

function E(t,c,x){var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
function tap(node,fn){node.addEventListener('click',function(ev){ev.preventDefault();fn(ev);});}

/* ---------- lyd: toner lages i farta, ingen lydfiler ---------- */
var SND=(function(){
  var ctx=null, pa=true;
  try{ pa = localStorage.getItem('sb-lyd')!=='av'; }catch(e){}
  function init(){
    if(ctx)return;
    try{ var C=window.AudioContext||window.webkitAudioContext; if(C)ctx=new C(); }catch(e){ ctx=null; }
  }
  function tone(f,start,dur,vol,type){
    if(!ctx)return;
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||'sine'; o.frequency.value=f;
    var t=ctx.currentTime+start;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t+dur+0.02);
  }
  var LYD={
    trykk:function(){ tone(520,0,.07,.10); },
    ok:   function(){ tone(660,0,.10,.13); tone(880,.07,.13,.11); },
    nei:  function(){ tone(196,0,.16,.11,'triangle'); },
    klar: function(){ tone(659,0,.10,.13); tone(880,.08,.10,.12); tone(1175,.16,.20,.11); },
    seier:function(){ [523,659,784,1047].forEach(function(f,i){ tone(f,i*.11,.30,.12); }); },
    tap:  function(){ [392,330,262].forEach(function(f,i){ tone(f,i*.13,.34,.12,'triangle'); }); }
  };
  return {
    er:function(){ return pa; },
    sett:function(v){ pa=v; try{ localStorage.setItem('sb-lyd',v?'på':'av'); }catch(e){} if(v){ lasOpp(); LYD.trykk(); } },
    lasOpp:lasOpp,
    spill:function(n){ if(!pa)return; lasOpp(); if(LYD[n])LYD[n](); }
  };
  function lasOpp(){ init(); if(ctx&&ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} } }
})();
function snd(n){ SND.spill(n); }

/* plasserer kort nedover i en kolonne og setter høyden */
function stableUt(colEls,data,minH){
  var w=colEls[0].getBoundingClientRect().width||46, ch=w*1.4;
  var top=colEls[0].getBoundingClientRect().top;
  var maxH=Math.max(minH||240,window.innerHeight-top-28);
  colEls.forEach(function(col,j){
    var kort=[].slice.call(col.querySelectorAll('.card'));
    if(!kort.length){col.style.height=Math.round(ch)+'px';return;}
    var dOff=ch*0.19, uOff=ch*0.31, nd=0, nu=0;
    data[j].forEach(function(c){c.up?nu++:nd++;});
    var tot=nd*dOff+Math.max(0,nu-1)*uOff;
    if(tot>maxH-ch&&tot>0){var k=(maxH-ch)/tot;dOff=Math.max(5,dOff*k);uOff=Math.max(9,uOff*k);}
    var y=0;
    kort.forEach(function(e,k){ e.style.top=Math.round(y)+'px'; y+=data[j][k].up?uOff:dOff; });
    var sis=kort.length-1;
    col.style.height=Math.round(y-(data[j][sis].up?uOff:dOff)+ch)+'px';
  });
}

/* ============ 1. KABAL ============ */
START.kabal=function(root,lagret){
  var SU=['\u2660','\u2665','\u2666','\u2663'], RK=['','E','2','3','4','5','6','7','8','9','10','Kn','D','K'];
  var LV=[{t:'Lett',k:5},{t:'Middels',k:6},{t:'Vanskelig',k:7}];
  var lvl=(Valg.hent('kabal').lvl!=null?Valg.hent('kabal').lvl:2);
  var stock,waste,found,tab,sel,moves,ANT;
  var box=E('div','kortbord'); box.id='kab';
  var st=E('p','status'); var cb=ctrls();
  var segEl=E('div','seg');
  function segs(){clear(segEl);LV.forEach(function(l,i){var b=E('button',i===lvl?'on':'',l.t);tap(b,function(){snd('trykk');lvl=i;Valg.sett('kabal',{lvl:lvl});segs();deal();});segEl.appendChild(b);});}
  cb.appendChild(mkBtn('Legg opp',autoUp));
  cb.appendChild(mkBtn('Nytt spill',deal,true));
  root.appendChild(segEl); root.appendChild(st); root.appendChild(cb); root.appendChild(box);

  var rowEl=E('div','row'), colsEl=E('div','cols');
  box.appendChild(rowEl); box.appendChild(colsEl);

  function deal(){
    ANT=LV[lvl].k;
    var d=[]; for(var s=0;s<4;s++)for(var r=1;r<=13;r++)d.push({r:r,s:s,up:false});
    shuffle(d);
    stock=[];waste=[];found=[[],[],[],[]];tab=[];sel=null;moves=0;
    for(var q=0;q<ANT;q++)tab.push([]);
    for(var i=0;i<ANT;i++)for(var j=i;j<ANT;j++){var c=d.pop();c.up=(j===i);tab[j].push(c);}
    // fix: deal so that column i gets i+1 cards, last one up
    stock=d;
    render();
  }
  function isRed(c){return c.s===1||c.s===2;}
  function cardEl(c){
    var e=E('div','card'+(isRed(c)?' red':''));
    if(!c.up){e.className='card down';return e;}
    e.appendChild(E('div','rk',RK[c.r]));
    e.appendChild(E('div','su',SU[c.s]));
    var b=E('div','big',SU[c.s]); e.appendChild(b);
    return e;
  }
  function selEq(a,b){return a&&b&&a.t===b.t&&a.col===b.col&&a.idx===b.idx&&a.i===b.i;}
  function picked(){ // returns array of cards currently selected
    if(!sel)return null;
    if(sel.t==='w')return waste.length?[waste[waste.length-1]]:null;
    if(sel.t==='f')return found[sel.i].length?[found[sel.i][found[sel.i].length-1]]:null;
    return tab[sel.col].slice(sel.idx);
  }
  function removePicked(){
    if(sel.t==='w')waste.pop();
    else if(sel.t==='f')found[sel.i].pop();
    else{var col=tab[sel.col];col.splice(sel.idx);
      if(col.length&&!col[col.length-1].up)col[col.length-1].up=true;}
  }
  function toCol(j){
    var arr=picked(); if(!arr||!arr.length)return false;
    if(sel.t==='c'&&sel.col===j)return false;
    var t=tab[j], top=t[t.length-1];
    var ok = t.length? (top.up && arr[0].r===top.r-1 && isRed(arr[0])!==isRed(top)) : (arr[0].r===13);
    if(!ok)return false;
    removePicked(); arr.forEach(function(c){tab[j].push(c);}); moves++; return true;
  }
  function toFound(i){
    var arr=picked(); if(!arr||arr.length!==1)return false;
    var c=arr[0]; if(c.s!==i)return false;
    var f=found[i]; if(f.length? c.r===f[f.length-1].r+1 : c.r===1){
      removePicked(); found[i].push(c); moves++; return true;
    } return false;
  }
  function autoUp(){
    var did=true, flyttet=false;
    while(did){ did=false;
      if(waste.length){var c=waste[waste.length-1];var f=found[c.s];
        if(f.length?c.r===f[f.length-1].r+1:c.r===1){waste.pop();f.push(c);moves++;did=true;flyttet=true;}}
      for(var j=0;j<7;j++){var col=tab[j];if(!col.length)continue;
        var t=col[col.length-1]; if(!t.up)continue; var g=found[t.s];
        if(g.length?t.r===g[g.length-1].r+1:t.r===1){col.pop();g.push(t);
          if(col.length&&!col[col.length-1].up)col[col.length-1].up=true;moves++;did=true;flyttet=true;}}
    }
    if(flyttet)snd('klar'); else {snd('nei');toast('Ingen kort kan legges opp nå',true);}
    sel=null; render(); check();
  }
  function render(){
    clear(rowEl); clear(colsEl);
    // stock
    var p=E('div','pile');
    if(stock.length){var c=E('div','card down');p.appendChild(c);}
    else{var s0=E('div','slot','\u21BB');p.appendChild(s0);}
    tap(p,function(){
      if(stock.length){var c=stock.pop();c.up=true;waste.push(c);snd('trykk');}
      else if(waste.length){while(waste.length){var w=waste.pop();w.up=false;stock.push(w);}
        snd('trykk');toast('Bunken er stokket om igjen');}
      else{snd('nei');toast('Ingen kort igjen i bunken',true);}
      sel=null;render();
    });
    rowEl.appendChild(p);
    // waste
    var pw=E('div','pile');
    if(waste.length){var wc=cardEl(waste[waste.length-1]);
      if(selEq(sel,{t:'w'}))wc.classList.add('sel');pw.appendChild(wc);}
    else pw.appendChild(E('div','slot'));
    tap(pw,function(){ if(!waste.length)return; snd('trykk');
      if(selEq(sel,{t:'w'}))sel=null; else sel={t:'w'}; render();});
    rowEl.appendChild(pw);
    rowEl.appendChild(E('div'));
    // foundations
    for(var i=0;i<4;i++)(function(i){
      var pf=E('div','pile'), f=found[i];
      if(f.length){var fc=cardEl(f[f.length-1]);pf.appendChild(fc);}
      else pf.appendChild(E('div','slot',SU[i]));
      tap(pf,function(){
        if(sel){
          if(toFound(i)){snd('ok');sel=null;render();check();return;}
          snd('nei');toast('Kortet passer ikke her',true);sel=null;render();return;
        }
        if(f.length){snd('trykk');sel={t:'f',i:i};}
        render();
      });
      rowEl.appendChild(pf);
    })(i);
    // tableau
    colsEl.style.gridTemplateColumns='repeat('+ANT+',minmax(0,1fr))';
    var colEls=[];
    for(var j=0;j<ANT;j++)(function(j){
      var col=E('div','col'); colEls.push(col);
      var sl=E('div','slot'); col.appendChild(sl);
      tap(sl,function(){
        if(!sel)return;
        if(toCol(j)){snd('ok');sel=null;render();check();return;}
        snd('nei');toast('Bare en konge kan flyttes hit',true);
      });
      tab[j].forEach(function(c,k){
        var e=cardEl(c);
        if(sel&&sel.t==='c'&&sel.col===j&&k>=sel.idx)e.classList.add('sel');
        tap(e,function(ev){
          ev.stopPropagation();

  function cands(g,i){
    var r=Math.floor(i/9),c=i%9,br=r-r%3,bc=c-c%3,used=0;
    for(var k=0;k<9;k++){used|=1<<g[r*9+k];used|=1<<g[k*9+c];used|=1<<g[(br+Math.floor(k/3))*9+bc+k%3];}

  }
  function bestCell(g){

    return bi;
  }
  function count(g,lim){
    var i=bestCell(g); if(i<0)return 1;
    var cs=cands(g,i),tot=0;

    return tot;

    var left=81;

  var LV=[{c:4,e:2,t:'Lett'},{c:6,e:2,t:'Middels'},{c:8,e:2,t:'Vanskelig'}];
  var CAP=4, lvl=Valg.hent('farge').lvl||0, tubes, sel=-1, hist;

  function key(s){return s.map(function(t){return t.join(',');}).sort().join('|');}
  function done(s){return s.every(function(t){return t.length===0||(t.length===CAP&&t.every(function(x){return x===t[0];}));});}
  function runLen(t){var v=t[t.length-1],n=0;for(var i=t.length-1;i>=0&&t[i]===v;i--)n++;return n;}
  function moves(s){
    var out=[];
    for(var i=0;i<s.length;i++){
      var a=s[i]; if(!a.length)continue;
      var uni=a.every(function(x){return x===a[0];});
      if(uni&&a.length===CAP)continue;
      for(var j=0;j<s.length;j++){
        if(i===j)continue; var b=s[j];
        if(b.length>=CAP)continue;
        if(b.length&&b[b.length-1]!==a[a.length-1])continue;
        if(!b.length&&uni)continue;
        out.push([i,j]);
      }
    } return out;
  }
  function apply(s,m){
    var t=s.map(function(x){return x.slice();});
    var a=t[m[0]], b=t[m[1]], n=Math.min(runLen(a),CAP-b.length);

    for(var attempt=0;attempt<60;attempt++){
      var balls=[]; for(var c=0;c<cfg.c;c++)for(var k=0;k<CAP;k++)balls.push(c);
      shuffle(balls);
      var t=[]; for(var i=0;i<cfg.c;i++)t.push(balls.slice(i*CAP,i*CAP+CAP));
      for(var e=0;e<cfg.e;e++)t.push([]);
      if(done(t))continue;
      if(solvable(t)){tubes=t;break;}
    }
    if(!tubes)tubes=t;
    sel=-1; hist=[]; render();
  }
  function push(){ hist.push(tubes.map(function(t){return t.slice();})); if(hist.length>200)hist.shift(); }
  function undo(){ if(!hist.length)return; tubes=hist.pop(); sel=-1; render(); }
  function render(){
    clear(area);
    tubes.forEach(function(t,i){
      var el=E('div','tube'+(sel===i?' on':''));
      t.forEach(function(c,k){
        var b=E('div','ball'); b.style.background=COL[c];
        if(sel===i&&k>=t.length-runLen(t))b.classList.add('lift');
        el.appendChild(b);
      });
      tap(el,function(){hit(i);});
      area.appendChild(el);
    });
    undoB.disabled=!hist.length;
    var ok=tubes.filter(function(t){return t.length===CAP&&t.every(function(x){return x===t[0];});}).length;
    st.innerHTML='Ferdige glass: <b>'+ok+'</b> av '+LV[lvl].c;
    lagreSenere();

  function shake(i){
    var el=area.children[i]; if(!el)return;
    el.classList.add('no'); setTimeout(function(){el.classList.remove('no');},320);

  function hit(i){
    if(sel<0){
      if(!tubes[i].length){ snd('nei'); toast('Glasset er tomt',true); return; }
      snd('trykk'); sel=i; render(); return;
    }
    if(sel===i){ snd('trykk'); sel=-1; render(); return; }
    var a=tubes[sel], b=tubes[i];
    if(b.length<CAP&&(!b.length||b[b.length-1]===a[a.length-1])){
      push();
      var n=Math.min(runLen(a),CAP-b.length);
      for(var k=0;k<n;k++)b.push(a.pop());
      var ferdig=b.length===CAP&&b.every(function(x){return x===b[0];});
      sel=-1; render();
      if(ferdig){ snd('klar'); toast('Glasset er ferdig!'); } else snd('ok');
      if(done(tubes))setTimeout(function(){win('Alt sortert!','Hver farge har sitt eget glass.',start);},350);
    } else {
      shake(i); snd('nei');
      toast(b.length>=CAP?'Glasset er fullt':'Kulene må ha samme farge',true);
      sel=-1; render();
    }
  }
  SPILL_NAA={id:'farge',dump:function(){
    if(!tubes||done(tubes)||!hist.length)return null;
    return {lvl:lvl,tubes:tubes,hist:hist.slice(-30)};
  }};
  function lastInn(o){
    if(!o||!o.tubes||!o.tubes.length)return false;
    lvl=o.lvl; tubes=o.tubes; hist=o.hist||[]; sel=-1;

START.edd=function(root,lagret){
  var LV=[{t:'Lett',f:1},{t:'Middels',f:2},{t:'Vanskelig',f:4}];
  var lvl=(Valg.hent('edd').lvl!=null?Valg.hent('edd').lvl:0);
  var tab, lager, ferdige, sel, FARGER;
  var st=E('p','status'), cb=ctrls(), delB;
  var box=E('div','kortbord'); box.id='edd';
  var colsEl=E('div','cols'); box.appendChild(colsEl);
  var segEl=E('div','seg');
  function segs(){clear(segEl);LV.forEach(function(l,i){var b=E('button',i===lvl?'on':'',l.t);tap(b,function(){snd('trykk');lvl=i;Valg.sett('edd',{lvl:lvl});segs();gi();});segEl.appendChild(b);});}
  delB=mkBtn('Del ut kort',delUt);
  cb.appendChild(delB); cb.appendChild(mkBtn('Nytt spill',gi,true));
  root.appendChild(segEl); root.appendChild(st); root.appendChild(cb); root.appendChild(box);

  function gi(){
    FARGER=LV[lvl].f;
    var d=[];
    for(var g=0;g<4;g++)for(var r=1;r<=13;r++)d.push({r:r,s:g%FARGER,up:false});
    shuffle(d);
    tab=[[],[],[],[],[],[],[]]; ferdige=0; sel=null;
    for(var i=0;i<7;i++)for(var j=i;j<7;j++){var c=d.pop();c.up=(j===i);tab[j].push(c);}
    lager=d;
    tegn();
  }
  /* er kortene fra idx og ut en synkende rekke? */
  function rekke(col,idx){
    var t=tab[col];
    for(var i=idx;i<t.length;i++){
      if(!t[i].up)return false;
      if(i>idx&&t[i].r!==t[i-1].r-1)return false;
      if(i>idx&&t[i].s!==t[i-1].s)return false;
    }
    return true;
  }
  function flytt(fra,idx,til){
    if(fra===til)return false;
    var run=tab[fra].slice(idx), m=tab[til], topp=m[m.length-1];
    if(m.length){ if(!topp.up||run[0].r!==topp.r-1)return false; }
    tab[fra].splice(idx);
    run.forEach(function(c){ m.push(c); });
    var f=tab[fra];
    if(f.length&&!f[f.length-1].up)f[f.length-1].up=true;
    ryddFerdig(til);
    return true;
  }
  /* konge ned til ess i én kolonne fjernes */
  function ryddFerdig(j){
    var t=tab[j];
    if(t.length<13)return;
    var s=t.length-13;
    for(var i=0;i<13;i++){
      var c=t[s+i];
      if(!c.up||c.r!==13-i)return;
      if(c.s!==t[s].s)return;
    }
    t.splice(s); ferdige++;
    if(t.length&&!t[t.length-1].up)t[t.length-1].up=true;
    snd('klar'); toast('En hel rekke er ferdig!');
  }
  function delUt(){
    if(!lager.length){ snd('nei'); toast('Ingen flere kort å dele ut',true); return; }
    var n=Math.min(7,lager.length);
    for(var j=0;j<n;j++){ var c=lager.pop(); c.up=true; tab[j].push(c); }
    for(var k=0;k<n;k++)ryddFerdig(k);
    sel=null; tegn();
  }
  function tegn(){
    clear(colsEl);
    var colEls=[];
    for(var j=0;j<7;j++)(function(j){
      var col=E('div','col'); colEls.push(col);
      var sl=E('div','slot');
      tap(sl,function(){
        if(!sel){ return; }
        if(flytt(sel.col,sel.idx,j)){ snd('ok'); sel=null; tegn(); sjekk(); return; }
        snd('nei'); toast('Kortet kan ikke flyttes hit',true);
      });
      col.appendChild(sl);
      tab[j].forEach(function(c,k){
        var e=kortEl(c);
        if(sel&&sel.col===j&&k>=sel.idx)e.classList.add('sel');
        tap(e,function(ev){
          ev.stopPropagation();
          if(!c.up){
            if(k===tab[j].length-1){ c.up=true; snd('trykk'); sel=null; tegn(); }
            return;
          }
          if(sel){
            if(flytt(sel.col,sel.idx,j)){ snd('ok'); sel=null; tegn(); sjekk(); return; }
            if(sel.col===j&&sel.idx===k){ sel=null; tegn(); return; }
          }
          if(!rekke(j,k)){ snd('nei'); toast('Bare kort som ligger i rekkefølge kan flyttes',true); return; }
          snd('trykk'); sel={col:j,idx:k}; tegn();
        });
        col.appendChild(e);
      });
      colsEl.appendChild(col);
    })(j);
    stableUt(colEls,tab,200);
    delB.disabled=!lager.length;
    st.innerHTML='Ferdige rekker: <b>'+ferdige+'</b> av 4 \u00B7 Igjen i bunken: '+lager.length;
    lagreSenere();
  }
  function sjekk(){
    if(ferdige===4)win('Kabalen gikk opp!','Alle fire rekkene er ferdige.',gi);
  }
  window.addEventListener('resize',function(){ if(document.getElementById('edd'))tegn(); });
  SPILL_NAA={id:'edd',dump:function(){
    if(!tab||ferdige===4)return null;
    if(lager.length===24&&ferdige===0)return null;
    return {lvl:lvl,tab:tab,lager:lager,ferdige:ferdige};
  }};
  function lastInn(o){
    if(!o||!o.tab||o.tab.length!==7)return false;
    if(o.lvl!=null)lvl=o.lvl;
    FARGER=LV[lvl].f;
    tab=o.tab; lager=o.lager; ferdige=o.ferdige; sel=null;
    segs(); tegn(); return true;
  }
  segs();
  if(!lastInn(lagret))gi();
};

      segM.appendChild(b);

  function idx(r,c){return r*C+c;}

    for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
      if(!dr&&!dc)continue;

    var plasser=[];

      return;

    var kø=[i];
    while(kø.length){
      var k=kø.pop();
      if(apen[k]||flagg[k])continue;
      apen[k]=1;
      if(felt[k]===0)naboer(k).forEach(function(x){ if(!apen[x])kø.push(x); });
    }
    snd('trykk'); tegn(); sjekk();
  }
  function sjekk(){

      });

  function lastInn(o){

    apen=o.apen||{}; flagg=o.flagg||{};
    startet=true; tapt=false; ferdig=false;

/* ============ 8. BÆRPLUKK ============ */
START.baer=function(root,lagret){
  var ALLE=['\uD83C\uDF53','\uD83E\uDED0','\uD83C\uDF52','\uD83C\uDF47','\uD83C\uDF4E','\uD83C\uDF51'];
  var LV=[{t:'Lett',n:4,mal:12},{t:'Middels',n:5,mal:18},{t:'Vanskelig',n:6,mal:25}];
  var C=7, R=8, lvl=Valg.hent('baer').lvl||0, rute, sort, malBaer, plukket, sel, laast;
  var st=E('p','status'), malEl=E('div','mal'), board=E('div','board'), holder=E('div'); holder.id='bar';
  holder.appendChild(malEl); holder.appendChild(board);
  var segL=E('div','seg');
  var cb=ctrls(); cb.appendChild(mkBtn('Nytt brett',start,true));
  root.appendChild(segL); root.appendChild(st); root.appendChild(cb); root.appendChild(holder);
  function segs(){clear(segL);LV.forEach(function(l,i){var b=E('button',i===lvl?'on':'',l.t);tap(b,function(){snd('trykk');lvl=i;Valg.sett('baer',{lvl:lvl});segs();start();});segL.appendChild(b);});}

  function ny(){ return sort[Math.floor(Math.random()*sort.length)]; }
  function tref(g){
    var m={};
    for(var r=0;r<R;r++)for(var c=0;c<C-2;c++){
      var v=g[r*C+c]; if(!v)continue;
      if(g[r*C+c+1]===v&&g[r*C+c+2]===v){
        var k=c; while(k<C&&g[r*C+k]===v){m[r*C+k]=1;k++;}
      }
    }
    for(var c2=0;c2<C;c2++)for(var r2=0;r2<R-2;r2++){
      var v2=g[r2*C+c2]; if(!v2)continue;
      if(g[(r2+1)*C+c2]===v2&&g[(r2+2)*C+c2]===v2){
        var k2=r2; while(k2<R&&g[k2*C+c2]===v2){m[k2*C+c2]=1;k2++;}
      }
    }
    return Object.keys(m).map(Number);
  }
  function bytt(g,a,b){ var t=g[a]; g[a]=g[b]; g[b]=t; }
  function finnesTrekk(g){
    for(var i=0;i<C*R;i++){
      var c=i%C;
      if(c<C-1){ bytt(g,i,i+1); var t1=tref(g).length; bytt(g,i,i+1); if(t1)return true; }
      if(i+C<C*R){ bytt(g,i,i+C); var t2=tref(g).length; bytt(g,i,i+C); if(t2)return true; }
    }
    return false;
  }
  function nyttBrett(){
    var g;
    do{
      g=[];
      for(var i=0;i<C*R;i++)g.push(ny());
      var vakt=0;
      while(tref(g).length&&vakt++<400)tref(g).forEach(function(i){g[i]=ny();});
    }while(tref(g).length||!finnesTrekk(g));
    return g;
  }
  function start(){
    var L=LV[lvl];
    sort=ALLE.slice(0,L.n);
    malBaer=sort[Math.floor(Math.random()*sort.length)];
    plukket=0; sel=null; laast=false;
    rute=nyttBrett();
    board.style.gridTemplateColumns='repeat('+C+',minmax(0,1fr))';
    tegn();
  }
  function tegn(vekk){
    clear(board);
    for(var i=0;i<C*R;i++)(function(i){
      var cls='bt'+(sel===i?' valgt':'')+(vekk&&vekk.indexOf(i)>=0?' vekk':'');
      var e=E('div',cls,rute[i]);
      tap(e,function(){trykk(i);});
      board.appendChild(e);
    })(i);
    clear(malEl);
    malEl.appendChild(E('span',null,malBaer));
    var b=E('b',null,plukket+' av '+LV[lvl].mal);
    malEl.appendChild(b);
    st.textContent='Bytt to bær som ligger inntil hverandre';
    if(!laast)lagreSenere();
  }
  function inntil(a,b){
    var ra=Math.floor(a/C), ca=a%C, rb=Math.floor(b/C), cb2=b%C;
    return Math.abs(ra-rb)+Math.abs(ca-cb2)===1;
  }
  function trykk(i){
    if(laast)return;
    if(sel===null){ snd('trykk'); sel=i; tegn(); return; }
    if(sel===i){ snd('trykk'); sel=null; tegn(); return; }
    if(!inntil(sel,i)){ snd('trykk'); sel=i; tegn(); return; }
    var a=sel, b=i;
    bytt(rute,a,b);
    if(!tref(rute).length){
      bytt(rute,a,b); sel=null; tegn();
      snd('nei'); toast('Det gir ingen rekke',true);
      var el=board.children[b]; if(el){el.classList.add('nei');setTimeout(function(){el.classList.remove('nei');},320);}
      return;
    }
    sel=null; laast=true; snd('ok'); tegn();
    setTimeout(loes,140);
  }
  function loes(){
    var m=tref(rute);
    if(!m.length){
      if(!finnesTrekk(rute)){ rute=nyttBrett(); toast('Ingen trekk igjen \u2014 nytt brett'); }
      laast=false; tegn();
      if(plukket>=LV[lvl].mal)
        setTimeout(function(){win('Kurven er full!','Du plukket '+plukket+' '+malBaer,start);},250);
      return;
    }
    var traff=0;
    m.forEach(function(i){ if(rute[i]===malBaer){plukket++;traff++;} });
    snd(m.length>=4?'klar':'ok');
    if(traff>=3)toast(traff+' '+malBaer+' på én gang!');
    tegn(m);
    setTimeout(function(){
      m.forEach(function(i){ rute[i]=null; });
      for(var c=0;c<C;c++){
        var kol=[];
        for(var r=R-1;r>=0;r--)if(rute[r*C+c]!==null)kol.push(rute[r*C+c]);
        for(var r2=R-1;r2>=0;r2--){
          var v=kol[R-1-r2];
          rute[r2*C+c]=(v===undefined?ny():v);
        }
      }
      tegn();
      setTimeout(loes,160);
    },200);
  }
  SPILL_NAA={id:'baer',dump:function(){
    if(!rute||laast||!plukket)return null;
    if(plukket>=LV[lvl].mal)return null;
    return {lvl:lvl,sort:sort,malBaer:malBaer,plukket:plukket,rute:rute};
  }};
  function lastInn(o){
    if(!o||!o.rute||o.rute.length!==C*R)return false;
    lvl=o.lvl; sort=o.sort; malBaer=o.malBaer; plukket=o.plukket; rute=o.rute;
    sel=null; laast=false;
    board.style.gridTemplateColumns='repeat('+C+',minmax(0,1fr))';
    segs(); tegn(); return true;
  }
  if(!lastInn(lagret)){ segs(); start(); }
};

      if(cy<b.y)ny2=cy; else if(cy>b.y+b.len-1)ny2=cy-b.len+1; else { valgt=-1; tegn(); return; }
      if(ny2<0||ny2+b.len>N){ snd('nei'); return; }
      for(var y=Math.min(ny2,b.y);y<=Math.max(ny2+b.len-1,b.y+b.len-1);y++)
        if(!ledig(g,b.x,y,valgt)){ snd('nei'); toast('Det står en bil i veien',true); return; }
      b.y=ny2;
    }
    antTrekk++; valgt=-1; snd('ok'); tegn();
    if(biler[0].x+biler[0].len===N)toast('Nå er veien klar \u2014 trykk på \u00e5pningen');
  }
  function kjorUt(){
    if(ferdig)return;
    var b=biler[0];
    if(b.x+b.len!==N){ snd('nei'); toast('Den r\u00f8de bilen m\u00e5 helt bort til \u00e5pningen f\u00f8rst',true); return; }
    antTrekk++; ferdig=true;
    if(!lost[idx]||lost[idx]>antTrekk){ lost[idx]=antTrekk; lagre(); }
    b.x=N;
    tegn();
    var perfekt=(antTrekk<=fasit);
    st.innerHTML='Ute! <b>'+antTrekk+'</b> trekk'+(perfekt?' \u2014 korteste vei':'');
    win('Bilen er ute!',perfekt?'Du klarte det p\u00e5 korteste vei: '+antTrekk+' trekk.'
      :'Du brukte '+antTrekk+' trekk. Korteste vei er '+fasit+'.',neste);
  }
  SPILL_NAA={id:'bilkoe',dump:function(){
    if(ferdig||!antTrekk)return null;
    return {lvl:lvl,idx:idx,biler:biler,antTrekk:antTrekk};
  }};
  function lastInn(o){
    if(!o||!o.biler||!o.biler.length)return false;
    if(o.lvl!=null)lvl=o.lvl;
    idx=o.idx; biler=o.biler; antTrekk=o.antTrekk;
    fasit=tolk(BANER[idx]).fasit; valgt=-1; ferdig=false;
    segs(); tegn(); return true;
  }
  segs();
  if(!lastInn(lagret))start(LV[lvl].fra);
};

menu();

/* offline: registrer service worker (feiler stille lokalt uten https) */
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
